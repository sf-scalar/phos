name: Feature Request
description: Suggest an idea, optimization, or new model configuration for Scalar Phos.
title: "[Feature]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Tell us about the feature or optimization you'd like to see added to Scalar Phos.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear description of what problem the feature solves. (e.g., "I'm always frustrated when...")
      placeholder: Describe the pain point...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the proposed feature or architecture...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered.
      placeholder: Alternative approaches...
    validations:
      required: false
